<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ book_title }} - EPUB Reader</title>
  <style>
    :root {
      --bg: #ffffff;
      --text: #1f2937;
      --header-bg: #f8fafc;
      --border: #e2e8f0;
      --accent: #2563eb;
      --sidebar-bg: #f1f5f9;
      --nav-hover: rgba(0, 0, 0, 0.05);
      --font-family: "Georgia", "Cambria", "Times New Roman", serif;
      --font-size: 18px;
      --line-height: 1.75;
      --max-width: 720px;
    }

    [data-theme="sepia"] {
      --bg: #fbf0d9;
      --text: #5f4b32;
      --header-bg: #f4e4c1;
      --border: #e6d3a8;
      --accent: #92400e;
      --sidebar-bg: #eedcb7;
      --nav-hover: rgba(95, 75, 50, 0.1);
    }

    [data-theme="dark"] {
      --bg: #1e293b;
      --text: #f1f5f9;
      --header-bg: #0f172a;
      --border: #334155;
      --accent: #38bdf8;
      --sidebar-bg: #111827;
      --nav-hover: rgba(255, 255, 255, 0.08);
    }

    [data-theme="black"] {
      --bg: #000000;
      --text: #d1d5db;
      --header-bg: #0a0a0a;
      --border: #262626;
      --accent: #60a5fa;
      --sidebar-bg: #0f0f0f;
      --nav-hover: rgba(255, 255, 255, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-family);
      font-size: var(--font-size);
      line-height: var(--line-height);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      transition: background-color 0.15s, color 0.15s;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 52px;
      padding: 0 16px;
      background-color: var(--header-bg);
      border-bottom: 1px solid var(--border);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      z-index: 20;
      user-select: none;
    }

    .header-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .book-title-header {
      font-weight: 600;
      max-width: 320px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      text-decoration: none;
      transition: all 0.15s ease;
    }

    .btn:hover {
      background: var(--nav-hover);
      border-color: var(--accent);
    }

    .theme-group {
      display: flex;
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
    }

    .theme-btn {
      padding: 4px 8px;
      font-size: 11px;
      border: none;
      background: transparent;
      color: var(--text);
      cursor: pointer;
    }

    .theme-btn.active {
      background: var(--accent);
      color: #ffffff;
    }

    .font-select {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 4px 6px;
      border-radius: 6px;
      font-size: 12px;
      outline: none;
    }

    .main-layout {
      display: flex;
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    /* Sidebar Table of Contents */
    #sidebar {
      width: 290px;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      display: none;
      flex-direction: column;
      z-index: 15;
      overflow-y: auto;
      padding: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #sidebar.open {
      display: flex;
    }

    .sidebar-title {
      font-weight: 700;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 12px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
    }

    .toc-item {
      padding: 8px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      line-height: 1.4;
      color: var(--text);
      text-decoration: none;
      margin-bottom: 2px;
      display: block;
      transition: background-color 0.15s;
    }

    .toc-item:hover {
      background: var(--nav-hover);
      color: var(--accent);
    }

    .toc-item.active {
      background: var(--accent);
      color: #ffffff;
      font-weight: 600;
    }

    /* Content Scrolling Viewport */
    #viewport {
      flex: 1;
      height: 100%;
      overflow-y: auto;
      padding: 40px 20px 80px 20px;
      scroll-behavior: smooth;
    }

    .reading-content {
      max-width: var(--max-width);
      margin: 0 auto;
    }

    /* Book Typography */
    .reading-content h1, 
    .reading-content h2, 
    .reading-content h3, 
    .reading-content h4 {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 700;
      color: var(--text);
      margin-top: 1.8em;
      margin-bottom: 0.8em;
      line-height: 1.25;
    }

    .reading-content h1 {
      font-size: 1.8em;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.3em;
    }

    .reading-content p {
      margin-bottom: 1.15em;
      text-align: justify;
      hyphens: auto;
    }

    .reading-content img, .reading-content svg {
      max-width: 100% !important;
      height: auto !important;
      display: block;
      margin: 1.8em auto;
      border-radius: 6px;
    }

    .reading-content blockquote {
      margin: 1.5em 1em;
      padding-left: 1.2em;
      border-left: 3px solid var(--accent);
      opacity: 0.9;
      font-style: italic;
    }

    .reading-content pre {
      background: rgba(0, 0, 0, 0.05);
      padding: 12px;
      border-radius: 6px;
      overflow-x: auto;
      font-family: Consolas, monospace;
      font-size: 0.9em;
      margin-bottom: 1.2em;
    }

    /* Chapter Navigation Bar */
    .chapter-nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 48px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    footer {
      height: 30px;
      background: var(--header-bg);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      font-size: 11px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      opacity: 0.85;
    }

    #loading-spinner {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      font-weight: 500;
      display: none;
    }
  </style>
</head>
<body data-theme="light">
  <header>
    <div class="header-group">
      <a href="/" class="btn" title="Back to Dashboard">← Library</a>
      <button id="toc-btn" class="btn" title="Table of Contents (Hotkey: T)">📑 Contents</button>
      <span class="book-title-header" id="header-book-title">{{ book_title }}</span>
    </div>

    <div class="header-group">
      <select id="font-family-select" class="font-select" onchange="setFontFamily(this.value)">
        <option value='"Georgia", "Cambria", serif'>Georgia (Serif)</option>
        <option value='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif'>System (Sans)</option>
        <option value='"Consolas", "Courier New", monospace'>Monospace</option>
      </select>

      <button class="btn" onclick="adjustFontSize(-1)" title="Smaller font (Hotkey: -)">A-</button>
      <span id="font-size-label" style="font-size:11px; min-width:32px; text-align:center;">18px</span>
      <button class="btn" onclick="adjustFontSize(1)" title="Larger font (Hotkey: +)">A+</button>

      <div class="theme-group">
        <button class="theme-btn active" data-theme-val="light" onclick="setTheme('light')" title="Light">Light</button>
        <button class="theme-btn" data-theme-val="sepia" onclick="setTheme('sepia')" title="Sepia">Sepia</button>
        <button class="theme-btn" data-theme-val="dark" onclick="setTheme('dark')" title="Slate Dark">Dark</button>
        <button class="theme-btn" data-theme-val="black" onclick="setTheme('black')" title="OLED Black">Black</button>
      </div>

      <a href="/view?url={{ book_url | urlencode }}&mode=pdf" target="_blank" class="btn" title="Convert and view in native browser PDF viewer">📄 View PDF ↗</a>
      <a href="{{ raw_file_url }}?download=1" class="btn" title="Download original EPUB archive">💾 Raw</a>
    </div>
  </header>

  <div class="main-layout">
    <div id="sidebar">
      <div class="sidebar-title">Table of Contents</div>
      <div id="toc-list">Loading chapters...</div>
    </div>

    <div id="viewport">
      <div class="reading-content" id="chapter-content">
        <!-- Chapter text dynamically loaded here -->
      </div>

      <div class="reading-content">
        <div class="chapter-nav-bar">
          <button class="btn" id="prev-ch-btn" onclick="loadChapter(currentChapterIndex - 1)">← Previous Chapter</button>
          <span id="nav-chapter-indicator" style="font-size:12px; color:var(--text); opacity:0.8;">Chapter 1 of 1</span>
          <button class="btn" id="next-ch-btn" onclick="loadChapter(currentChapterIndex + 1)">Next Chapter →</button>
        </div>
      </div>

      <div id="loading-spinner">Loading chapter...</div>
    </div>
  </div>

  <footer>
    <span id="status-left">Chapter 1</span>
    <span id="status-right">0%</span>
  </footer>

  <script>
    const bookUrl = {{ book_url | tojson }};
    const storageKey = 'reader_pos_' + encodeURIComponent(bookUrl);

    let chaptersList = [];
    let currentChapterIndex = 0;
    let currentTheme = localStorage.getItem('reader_theme') || 'light';
    let currentFontSize = parseInt(localStorage.getItem('reader_font_size') || '18', 10);
    let currentFontFamily = localStorage.getItem('reader_font_family') || '"Georgia", "Cambria", serif';

    function setTheme(theme) {
      currentTheme = theme;
      document.body.setAttribute('data-theme', theme);
      localStorage.setItem('reader_theme', theme);
      document.querySelectorAll('.theme-btn').forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('data-theme-val') === theme);
      });
    }

    function setFontFamily(font) {
      currentFontFamily = font;
      document.documentElement.style.setProperty('--font-family', font);
      localStorage.setItem('reader_font_family', font);
      document.getElementById('font-family-select').value = font;
    }

    function adjustFontSize(delta) {
      currentFontSize = Math.min(Math.max(currentFontSize + delta * 2, 12), 34);
      document.documentElement.style.setProperty('--font-size', currentFontSize + 'px');
      document.getElementById('font-size-label').textContent = currentFontSize + 'px';
      localStorage.setItem('reader_font_size', currentFontSize);
    }

    async function loadChapter(index, restoreScroll = false) {
      if (index < 0 || (chaptersList.length && index >= chaptersList.length)) return;

      currentChapterIndex = index;
      const contentEl = document.getElementById('chapter-content');
      const spinner = document.getElementById('loading-spinner');
      const viewport = document.getElementById('viewport');

      spinner.style.display = 'block';

      try {
        const resp = await fetch(`/api/epub/chapter?url=${encodeURIComponent(bookUrl)}&index=${index}`);
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const data = await resp.json();

        contentEl.innerHTML = data.content;
        document.getElementById('status-left').textContent = data.title;
        document.getElementById('nav-chapter-indicator').textContent = `Chapter ${index + 1} of ${data.total}`;
        document.getElementById('prev-ch-btn').disabled = !data.has_prev;
        document.getElementById('next-ch-btn').disabled = !data.has_next;

        // Save position
        localStorage.setItem(storageKey, JSON.stringify({ index: index, scroll: 0 }));

        // Update active sidebar item
        document.querySelectorAll('.toc-item').forEach((el, i) => {
          el.classList.toggle('active', i === index);
        });

        if (!restoreScroll) {
          viewport.scrollTop = 0;
        }

        // Scroll percentage calculation
        updateProgress();

      } catch (err) {
        contentEl.innerHTML = `<div style="color:#ef4444; padding:20px;">Failed to load chapter: ${err.message}</div>`;
      } finally {
        spinner.style.display = 'none';
      }
    }

    async function initReader() {
      setTheme(currentTheme);
      setFontFamily(currentFontFamily);
      adjustFontSize(0);

      try {
        // Fetch book table of contents and spine
        const resp = await fetch(`/api/epub/info?url=${encodeURIComponent(bookUrl)}`);
        const data = await resp.json();

        chaptersList = data.chapters || [];
        document.getElementById('header-book-title').textContent = data.title;
        document.title = data.title + ' - EPUB Reader';

        // Render TOC sidebar
        const tocContainer = document.getElementById('toc-list');
        tocContainer.innerHTML = '';
        chaptersList.forEach((ch, idx) => {
          const item = document.createElement('a');
          item.className = 'toc-item';
          item.textContent = ch.title;
          item.onclick = (e) => {
            e.preventDefault();
            loadChapter(idx);
            if (window.innerWidth < 768) {
              document.getElementById('sidebar').classList.remove('open');
            }
          };
          tocContainer.appendChild(item);
        });

        // Restore saved position or start at chapter 0
        const savedPos = JSON.parse(localStorage.getItem(storageKey) || '{"index":0}');
        loadChapter(savedPos.index || 0);

      } catch (err) {
        document.getElementById('chapter-content').innerHTML = `
          <div style="color:#ef4444; padding:20px;">Error initializing book: ${err.message}</div>
        `;
      }
    }

    function updateProgress() {
      const vp = document.getElementById('viewport');
      const maxScroll = vp.scrollHeight - vp.clientHeight;
      const scrollPct = maxScroll > 0 ? (vp.scrollTop / maxScroll) : 0;
      const totalCh = chaptersList.length || 1;
      const totalPct = Math.round(((currentChapterIndex + scrollPct) / totalCh) * 100);
      document.getElementById('status-right').textContent = `${Math.min(totalPct, 100)}%`;
    }

    document.getElementById('viewport').addEventListener('scroll', updateProgress);

    // Sidebar Toggle
    document.getElementById('toc-btn').addEventListener('click', () => {
      document.getElementById('sidebar').classList.toggle('open');
    });

    // Keyboard navigation
    document.addEventListener('keydown', (e) => {
      // Don't trigger if focus is on inputs
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;

      if (e.key === 'ArrowRight' || e.key === 'n') {
        loadChapter(currentChapterIndex + 1);
      } else if (e.key === 'ArrowLeft' || e.key === 'p') {
        loadChapter(currentChapterIndex - 1);
      } else if (e.key === 't' || e.key === 'T') {
        document.getElementById('sidebar').classList.toggle('open');
      } else if (e.key === 'd' || e.key === 'D') {
        const themes = ['light', 'sepia', 'dark', 'black'];
        const nextIdx = (themes.indexOf(currentTheme) + 1) % themes.length;
        setTheme(themes[nextIdx]);
      } else if (e.key === '+' || e.key === '=') {
        adjustFontSize(1);
      } else if (e.key === '-' || e.key === '_') {
        adjustFontSize(-1);
      }
    });

    window.addEventListener('DOMContentLoaded', initReader);
  </script>
</body>
</html>
